services:
  frontend:
    build:
      context: ./network-management-front
      dockerfile: Dockerfile
    env_file:
      - ./network-management-front/.env
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
  
  backend:
    build:
      context: ./network-management-api
      dockerfile: Dockerfile
    env_file:
      - ./network-management-api/.env
    environment:
      # Must match the secret name below — node-openvpn reads cred.ovpn from here
      OVPN_CONFIG_PATH: /run/secrets/cred_ovpn
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # for reaching the MikroTik router on the host LAN
    secrets:
      - cred_ovpn
    depends_on:
      postgres:
        condition: service_healthy
    # ── Required: openvpn runs as a child process of this same container ──
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

volumes:
  postgres-data:

secrets:
  cred_ovpn:
    file: ./network-management-api/cred.ovpn
