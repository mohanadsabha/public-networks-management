server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Block scanners probing .git, .env, etc. (return 404, not index.html)
    location ~ /\. {
        return 404;
    }

    # API proxy
    location /api/ {
        proxy_pass https://api.wewifi.online;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json image/svg+xml;
}
